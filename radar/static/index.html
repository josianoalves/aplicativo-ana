<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RADAR SHOPEE AI</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Ir para o conteúdo</a>
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">◉</span><div>RADAR SHOPEE AI<small>ESTÚDIO DE AFILIADOS</small></div></div>
    <nav id="navigation" aria-label="Menu principal"></nav>
    <div class="sidebar-foot"><span class="dot" aria-hidden="true"></span> Ambiente local</div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="topbar">
      <div id="connection" class="status"><span class="dot" aria-hidden="true"></span> Conectando ao Radar</div>
      <div class="actions"><button id="pause" class="button secondary" disabled>Interromper automações</button><button id="run" class="button primary" disabled>Iniciar pesquisa</button></div>
    </header>
    <div class="content">
      <p id="notice" class="notice" role="status" hidden></p>
      <section id="view" aria-labelledby="title">
        <h1 id="title">Dashboard</h1>
        <p>Carregando dados locais…</p>
      </section>
    </div>
  </main>
</body>
</html>
